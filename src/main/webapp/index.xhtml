<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://xmlns.jcp.org/jsf/passthrough"
                template="/templates/layout.xhtml">

  <ui:define name="title">Vitrine - E-Shop</ui:define>

  <ui:define name="content">
    <h1>Vitrine</h1>

    <h:form styleClass="filters">
      <h:selectOneMenu value="#{vitrineBean.vitrineId}">
        <f:selectItem itemLabel="Toutes les vitrines" noSelectionOption="true"/>
        <f:selectItems value="#{vitrineBean.vitrines}" var="v" itemValue="#{v.id}" itemLabel="#{v.nom}"/>
      </h:selectOneMenu>
      <h:selectOneMenu value="#{vitrineBean.categorieId}">
        <f:selectItem itemLabel="Toutes les categories" noSelectionOption="true"/>
        <f:selectItems value="#{vitrineBean.categories}" var="c" itemValue="#{c.id}" itemLabel="#{c.nom}"/>
      </h:selectOneMenu>
      <h:inputText value="#{vitrineBean.motCle}" p:placeholder="Rechercher un produit..."/>
      <h:commandButton value="Filtrer" action="#{vitrineBean.filtrer}" styleClass="btn"/>
      <h:link outcome="index" value="Reinitialiser" styleClass="btn secondary"/>
    </h:form>

    <h:outputText value="Aucun produit trouve." rendered="#{empty vitrineBean.produits}"/>

    <h:form>
      <div class="grid">
        <ui:repeat value="#{vitrineBean.produits}" var="p">
          <div class="card">
            <span class="tag">#{p.categorie.nom}</span>
            <h3>#{p.nom}</h3>
            <p class="desc">#{p.description}</p>
            <div class="price">
              <h:outputText value="#{p.prix}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
            </div>
            <div class="stock out">
              <h:outputText value="Rupture de stock" rendered="#{p.stock le 0}"/>
            </div>
            <div class="stock">
              <h:outputText value="En stock : #{p.stock}" rendered="#{p.stock gt 0}"/>
            </div>
            <h:commandButton value="Ajouter au panier" action="#{panierBean.ajouter(p.id)}"
                             disabled="#{p.stock le 0}" styleClass="btn"/>
          </div>
        </ui:repeat>
      </div>
    </h:form>
  </ui:define>
</ui:composition>
