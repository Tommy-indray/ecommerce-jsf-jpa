<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/layout.xhtml">

  <ui:define name="title">Inscription - E-Shop</ui:define>

  <ui:define name="content">
    <h1>Inscription</h1>
    <h:form styleClass="form">
      <h:outputLabel for="nom" value="Nom"/>
      <h:inputText id="nom" value="#{internauteBean.nom}" required="true"
                   requiredMessage="Le nom est obligatoire"/>
      <h:message for="nom" styleClass="msg error"/>

      <h:outputLabel for="prenom" value="Prenom"/>
      <h:inputText id="prenom" value="#{internauteBean.prenom}" required="true"
                   requiredMessage="Le prenom est obligatoire"/>
      <h:message for="prenom" styleClass="msg error"/>

      <h:outputLabel for="email" value="E-mail"/>
      <h:inputText id="email" value="#{internauteBean.email}" required="true"
                   requiredMessage="L'e-mail est obligatoire">
        <f:validateRegex pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"/>
      </h:inputText>
      <h:message for="email" styleClass="msg error"/>

      <h:outputLabel for="mdp" value="Mot de passe (6 caracteres min.)"/>
      <h:inputSecret id="mdp" value="#{internauteBean.motDePasse}" required="true"
                     requiredMessage="Le mot de passe est obligatoire">
        <f:validateLength minimum="6"/>
      </h:inputSecret>
      <h:message for="mdp" styleClass="msg error"/>

      <h:outputLabel for="adresse" value="Adresse"/>
      <h:inputText id="adresse" value="#{internauteBean.adresse}"/>

      <h:commandButton value="Creer mon compte" action="#{internauteBean.inscrire}" styleClass="btn"/>
    </h:form>
  </ui:define>
</ui:composition>
