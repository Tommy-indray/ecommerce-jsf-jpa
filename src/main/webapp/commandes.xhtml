<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/layout.xhtml">

  <ui:define name="title">Mes commandes - E-Shop</ui:define>

  <ui:define name="content">
    <h1>Mes commandes</h1>

    <h:outputText value="Vous n'avez pas encore passe de commande." rendered="#{empty commandeBean.commandes}"/>

    <ui:repeat value="#{commandeBean.commandes}" var="c">
      <div class="order">
        <h3>Commande n&#176;#{c.id}
          <small>
            <h:outputText value="#{c.dateCommande}"><f:convertDateTime pattern="dd/MM/yyyy HH:mm"/></h:outputText>
            &#8212; #{c.statut}
          </small>
        </h3>
        <h:dataTable value="#{c.lignes}" var="l" styleClass="table" headerClass="th">
          <h:column>
            <f:facet name="header">Produit</f:facet>
            #{l.produit.nom}
          </h:column>
          <h:column>
            <f:facet name="header">Quantite</f:facet>
            #{l.quantite}
          </h:column>
          <h:column>
            <f:facet name="header">Prix unitaire</f:facet>
            <h:outputText value="#{l.prixUnitaire}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
          </h:column>
          <h:column>
            <f:facet name="header">Sous-total</f:facet>
            <h:outputText value="#{l.sousTotal}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
          </h:column>
        </h:dataTable>
        <p class="total">Total :
          <h:outputText value="#{c.montantTotal}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
        </p>
      </div>
    </ui:repeat>
  </ui:define>
</ui:composition>
