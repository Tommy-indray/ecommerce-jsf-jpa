<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title><ui:insert name="title">E-Shop</ui:insert></title>
  <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
  <header class="topbar">
    <h:link outcome="index" value="E-Shop" styleClass="brand"/>
    <nav>
      <h:link outcome="index" value="Vitrine"/>
      <h:link outcome="panier" value="Panier (#{panierBean.nbArticles})" rendered="#{internauteBean.authentifie}"/>
      <h:link outcome="commandes" value="Mes commandes" rendered="#{internauteBean.authentifie}"/>
      <h:link outcome="admin" value="Administration" rendered="#{internauteBean.admin}"/>
    </nav>
    <div class="user">
      <h:panelGroup rendered="#{internauteBean.authentifie}">
        <span>#{internauteBean.connecte.nomComplet}</span>
        <h:form styleClass="inline">
          <h:commandLink value="Deconnexion" action="#{internauteBean.logout}"/>
        </h:form>
      </h:panelGroup>
      <h:panelGroup rendered="#{not internauteBean.authentifie}">
        <h:link outcome="login" value="Connexion"/>
        <h:link outcome="register" value="Inscription"/>
      </h:panelGroup>
    </div>
  </header>

  <main class="container">
    <h:messages globalOnly="true" layout="list" styleClass="messages"
                infoClass="msg info" errorClass="msg error"/>
    <ui:insert name="content">Contenu</ui:insert>
  </main>

  <footer class="footer"> </footer>
</h:body>
</html>
