<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/layout.xhtml">

  <ui:define name="title">Mon panier - E-Shop</ui:define>

  <ui:define name="content">
    <h1>Mon panier</h1>

    <h:panelGroup rendered="#{empty panierBean.panier.lignes}">
      <p>Votre panier est vide.</p>
      <h:link outcome="index" value="Retour a la vitrine" styleClass="btn"/>
    </h:panelGroup>

    <h:form rendered="#{not empty panierBean.panier.lignes}">
      <h:dataTable value="#{panierBean.panier.lignes}" var="l" styleClass="table" headerClass="th">
        <h:column>
          <f:facet name="header">Produit</f:facet>
          #{l.produit.nom}
        </h:column>
        <h:column>
          <f:facet name="header">Prix unitaire</f:facet>
          <h:outputText value="#{l.produit.prix}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
        </h:column>
        <h:column>
          <f:facet name="header">Quantite</f:facet>
          <h:inputText value="#{l.quantite}" size="3" converterMessage="Quantite invalide"/>
          <h:commandButton value="OK" action="#{panierBean.mettreAJour(l.id, l.quantite)}" styleClass="btn small"/>
        </h:column>
        <h:column>
          <f:facet name="header">Sous-total</f:facet>
          <h:outputText value="#{l.sousTotal}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
        </h:column>
        <h:column>
          <h:commandButton value="Retirer" action="#{panierBean.retirer(l.id)}" styleClass="btn small danger"/>
        </h:column>
      </h:dataTable>

      <p class="total">Total :
        <h:outputText value="#{panierBean.panier.total}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
      </p>

      <h:commandButton value="Valider la commande" action="#{panierBean.valider}" styleClass="btn"/>
      <h:commandButton value="Vider le panier" action="#{panierBean.vider}" styleClass="btn secondary"/>
      <h:link outcome="index" value="Continuer mes achats" styleClass="btn secondary"/>
    </h:form>
  </ui:define>
</ui:composition>
