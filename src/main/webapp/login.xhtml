<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/layout.xhtml">

  <ui:define name="title">Connexion - E-Shop</ui:define>

  <ui:define name="content">
    <h1>Connexion</h1>
    <h:form styleClass="form">
      <h:outputLabel for="email" value="E-mail"/>
      <h:inputText id="email" value="#{internauteBean.email}" required="true"
                   requiredMessage="L'e-mail est obligatoire"/>
      <h:message for="email" styleClass="msg error"/>

      <h:outputLabel for="mdp" value="Mot de passe"/>
      <h:inputSecret id="mdp" value="#{internauteBean.motDePasse}" required="true"
                     requiredMessage="Le mot de passe est obligatoire"/>
      <h:message for="mdp" styleClass="msg error"/>

      <h:commandButton value="Se connecter" action="#{internauteBean.login}" styleClass="btn"/>
    </h:form>
    <p>Pas encore de compte ? <h:link outcome="register" value="Inscrivez-vous"/></p>
    <p class="hint">Comptes de demonstration : demo@shop.ma / demo123 &#8212; admin@shop.ma / admin123</p>
  </ui:define>
</ui:composition>
